<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>U9 Soccer — Grouped Sessions</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}

/* Header */
#header{padding:20px 16px 0;border-bottom:3px solid var(--accent,#3b82f6)}
.header-inner{max-width:780px;margin:0 auto}
.header-top{display:flex;align-items:center;gap:12px;padding-bottom:16px}
.group-tabs{display:flex;gap:0}
.group-tab{padding:10px 28px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.15s;border-radius:8px 8px 0 0;margin-right:3px;opacity:0.5}
.group-tab.active{opacity:1}

/* Main */
#main{max-width:780px;margin:0 auto;padding:24px 14px}

/* Session selector */
.session-nav{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.session-btn{padding:7px 16px;border-radius:8px;border:2px solid rgba(255,255,255,0.15);background:transparent;color:#94a3b8;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;transition:all 0.15s}
.session-btn.active{border-color:var(--accent);color:#fff;background:var(--accent)}

/* Session card */
.session-card{background:#1e293b;border-radius:14px;overflow:hidden;border:2px solid var(--accent)}
.session-header{padding:18px 20px;background:var(--accent)}
.session-header h2{font-size:18px;font-weight:800;color:#fff;margin-bottom:4px}
.session-header p{font-size:12px;color:rgba(255,255,255,0.75)}
.session-tags{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.stag{background:rgba(255,255,255,0.2);color:#fff;border-radius:5px;padding:2px 9px;font-size:11px}

/* Blocks */
.session-body{padding:20px}
.block{margin-bottom:16px;border-radius:10px;overflow:hidden}
.block-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
.block-title{font-size:11px;font-weight:800;letter-spacing:1px}
.block-duration{font-size:11px;background:rgba(0,0,0,0.3);border-radius:5px;padding:2px 8px;color:rgba(255,255,255,0.8)}
.block-body{padding:14px 14px 16px;background:#0f172a}
.block-name{font-size:15px;font-weight:700;color:#f1f5f9;margin-bottom:6px}
.block-desc{font-size:13px;color:#94a3b8;line-height:1.65}
.block-tip{font-size:12px;color:#64748b;margin-top:8px;font-style:italic;padding-top:8px;border-top:1px solid #1e293b}
.block-tip strong{color:#475569;font-style:normal}

/* Focus banner */
.focus-banner{background:#0f172a;border-radius:8px;padding:10px 14px;margin-bottom:16px;border-left:3px solid var(--accent)}
.focus-label{font-size:10px;font-weight:800;color:var(--accent);letter-spacing:1px;margin-bottom:3px}
.focus-text{font-size:13px;color:#cbd5e1;line-height:1.5}

/* Coaching notes */
.notes-block{background:#0f172a;border-radius:10px;padding:14px;margin-bottom:16px;border:1px solid #334155}
.notes-title{font-size:11px;font-weight:800;color:#64748b;letter-spacing:1px;margin-bottom:8px}
.note-item{font-size:12px;color:#94a3b8;line-height:1.6;padding:3px 0;display:flex;gap:8px}
.note-item::before{content:'→';color:var(--accent);flex-shrink:0}

/* Group philosophy strip */
.philosophy{background:#1e293b;border-radius:10px;padding:14px 16px;margin-bottom:20px;border-left:4px solid var(--accent)}
.philosophy-title{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:1px;margin-bottom:6px}
.philosophy-text{font-size:13px;color:#94a3b8;line-height:1.6}

/* Progression note */
.progression{background:#1e293b;border-radius:8px;padding:12px 14px;margin-top:16px;display:flex;gap:10px;align-items:flex-start}
.prog-icon{font-size:18px;flex-shrink:0}
.prog-text{font-size:12px;color:#64748b;line-height:1.5}
.prog-text strong{color:#94a3b8}

@media(max-width:480px){
  .group-tab{padding:8px 16px;font-size:13px}
  .session-header h2{font-size:16px}
  .block-name{font-size:14px}
}
</style>
</head>
<body>

<div id="header">
  <div class="header-inner">
    <div class="header-top">
      <span style="font-size:26px">⚽</span>
      <div>
        <h1 style="font-size:19px;font-weight:800;color:#fff">U9 Soccer — Skill Group Sessions</h1>
        <p style="font-size:12px;color:#94a3b8;margin-top:2px">10 players · 1 hour · Groups A, B &amp; C · 4 sessions each</p>
      </div>
    </div>
    <div class="group-tabs">
      <button class="group-tab active" id="tabA" onclick="setGroup('A')">Group A</button>
      <button class="group-tab" id="tabB" onclick="setGroup('B')">Group B</button>
      <button class="group-tab" id="tabC" onclick="setGroup('C')">Group C</button>
    </div>
  </div>
</div>

<div id="main"></div>

// ─── RENDER ───────────────────────────────────────────────────────────
let currentGroup = 'A';
let currentSession = 0;

const BLOCK_STYLES = {
  warmup:  { bg: '#78350f', border: '#f59e0b', label_color: '#fbbf24' },
  skill:   { bg: '#1e3a5f', border: '#3b82f6', label_color: '#60a5fa' },
  game:    { bg: '#1a3a2a', border: '#10b981', label_color: '#34d399' },
  free:    { bg: '#1e1b4b', border: '#8b5cf6', label_color: '#a78bfa' },
  chat:    { bg: '#1c1c2e', border: '#64748b', label_color: '#94a3b8' },
};

function setGroup(g) {
  currentGroup = g;
  currentSession = 0;
  ['A','B','C'].forEach(x => {
    document.getElementById('tab'+x).classList.toggle('active', x===g);
    document.getElementById('tab'+x).style.background = x===g ? GROUPS[x].colour : 'transparent';
    document.getElementById('tab'+x).style.color = '#fff';
  });
  document.documentElement.style.setProperty('--accent', GROUPS[g].colour);
  document.getElementById('header').style.borderBottomColor = GROUPS[g].colour;
  renderMain();
}

function renderMain() {
  const g = GROUPS[currentGroup];
  const s = g.sessions[currentSession];
  let html = '';

  // Philosophy strip
  html += `<div class="philosophy">
    <div class="philosophy-title">${g.label}</div>
    <div class="philosophy-text">${g.philosophy}</div>
  </div>`;

  // Session nav
  html += '<div class="session-nav">';
  g.sessions.forEach((sess, i) => {
    html += `<button class="session-btn${i===currentSession?' active':''}" onclick="setSession(${i})">Session ${i+1}</button>`;
  });
  html += '</div>';

  // Session card
  html += `<div class="session-card">
    <div class="session-header" style="background:${g.colour}">
      <h2>${s.title}</h2>
      <p>${s.theme}</p>
      <div class="session-tags">
        <span class="stag">⏱ 60 min</span>
        <span class="stag">👦 10 players</span>
        <span class="stag">⚽ U9</span>
      </div>
    </div>
    <div class="session-body">`;

  // Focus banner
  html += `<div class="focus-banner">
    <div class="focus-label">SESSION FOCUS</div>
    <div class="focus-text">${s.theme}</div>
  </div>`;

  // Blocks
  s.blocks.forEach(b => {
    const style = BLOCK_STYLES[b.type];
    html += `<div class="block" style="border:1px solid ${style.border}20">
      <div class="block-header" style="background:${style.bg}">
        <span class="block-title" style="color:${style.label_color}">${b.label}</span>
        <span class="block-duration">${b.duration}</span>
      </div>
      <div class="block-body">
        <div class="block-name">${b.name}</div>
        <div class="block-desc">${b.desc}</div>
        ${b.tip ? `<div class="block-tip"><strong>Coach note:</strong> ${b.tip}</div>` : ''}
      </div>
    </div>`;
  });

  // Coaching notes
  html += `<div class="notes-block">
    <div class="notes-title">📋 COACHING NOTES FOR THIS SESSION</div>`;
  s.coachingNotes.forEach(n => {
    html += `<div class="note-item">${n}</div>`;
  });
  html += '</div>';

  // Progression
  html += `<div class="progression">
    <span class="prog-icon">→</span>
    <div class="prog-text"><strong>Building toward:</strong> ${s.progression}</div>
  </div>`;

  html += '</div></div>'; // close session-body, session-card

  document.getElementById('main').innerHTML = html;
}

function setSession(i) {
  currentSession = i;
  renderMain();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// Boot
document.getElementById('tabA').style.background = GROUPS.A.colour;
document.getElementById('tabA').style.color = '#fff';
document.getElementById('tabB').style.color = '#fff';
document.getElementById('tabC').style.color = '#fff';
document.documentElement.style.setProperty('--accent', GROUPS.A.colour);
renderMain();
</script>
</body>
</html>
