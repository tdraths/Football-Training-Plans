<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under 9 Soccer Coaching Plan — 32 Weeks</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}
  h1{font-size:20px;font-weight:800;color:#fff}
  h2{font-size:18px;font-weight:800;color:#fff}
  h3{font-size:13px;font-weight:700;color:#f1f5f9;line-height:1.3}
  button{cursor:pointer;font-family:inherit}

  /* Header */
  #header{border-bottom:3px solid var(--accent);padding:20px 16px 16px;transition:background 0.3s}
  .header-inner{max-width:860px;margin:0 auto}
  .header-top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .header-controls{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
  .rot-btn{padding:7px 18px;border-radius:8px;border:2px solid;font-weight:700;font-size:13px;background:transparent;color:#fff;transition:all 0.15s}
  .rot-btn.active{border-color:var(--accent);background:var(--accent)}
  .rot-btn:not(.active){border-color:rgba(255,255,255,0.2)}
  .player-select-wrap{display:flex;align-items:center;gap:8px;margin-left:auto;background:rgba(255,255,255,0.1);border-radius:8px;padding:6px 12px}
  .player-select-wrap label{font-size:12px}
  #playerCount{background:transparent;border:none;color:#fff;font-size:13px;font-weight:700;outline:none}
  #playerCount option{background:#1e293b}

  /* Main grid */
  #main{max-width:860px;margin:0 auto;padding:20px 14px}
  .legend{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .legend-item{background:#1e293b;border-radius:8px;padding:5px 12px;font-size:11px;color:#94a3b8;display:flex;align-items:center;gap:5px}
  .legend-hint{margin-left:auto;background:#1e293b;border-radius:8px;padding:5px 12px;font-size:11px;color:#64748b}
  .week-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .week-card{background:#1e293b;border-radius:10px;padding:14px;cursor:pointer;transition:background 0.12s;border-left:4px solid var(--wc)}
  .week-card:hover{background:#263548}
  .week-badge{color:#fff;border-radius:5px;padding:2px 7px;font-size:10px;font-weight:700;display:inline-block;margin-bottom:6px}
  .week-drills{font-size:10px;color:#475569;margin-top:4px}

  /* Modal overlay */
  #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:50;overflow-y:auto;padding:16px}
  #overlay.open{display:flex;align-items:flex-start;justify-content:center}
  #modal{background:#0f172a;border-radius:14px;max-width:660px;width:100%;overflow:hidden;margin-bottom:20px}
  .modal-header{padding:18px 20px}
  .modal-header-top{display:flex;justify-content:space-between;align-items:flex-start}
  .modal-label{font-size:11px;font-weight:700;color:rgba(255,255,255,0.65);margin-bottom:3px;letter-spacing:1px}
  .modal-controls{display:flex;gap:8px;align-items:center}
  .edit-btn{padding:6px 12px;border:none;border-radius:7px;font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,0.2);transition:all 0.15s}
  .edit-btn.active{background:#fff}
  .close-btn{background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:7px;width:30px;height:30px;font-size:14px;display:flex;align-items:center;justify-content:center}
  .tags{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .tag{background:rgba(255,255,255,0.15);color:#fff;border-radius:5px;padding:2px 8px;font-size:11px}
  .modal-body{padding:18px 20px}

  /* Session blocks */
  .session-block{background:#1e293b;border-radius:10px;padding:14px 15px;margin-bottom:10px}
  .session-block-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .session-label{font-size:10px;font-weight:800;letter-spacing:1px}
  .session-meta{display:flex;gap:6px;align-items:center}
  .duration-badge{font-size:10px;color:#475569;background:#0f172a;border-radius:5px;padding:1px 7px}
  .swap-btn{font-size:10px;background:#334155;border:none;color:#94a3b8;border-radius:5px;padding:2px 8px;font-weight:700;display:none}
  .edit-mode .swap-btn{display:inline-block}
  .drill-name{font-weight:700;font-size:14px;color:#f1f5f9}
  .drill-name-warm{color:#fbbf24}
  .drill-desc{margin:6px 0 0;color:#94a3b8;font-size:13px;line-height:1.6}
  .ssformat{background:#064e3b;color:#34d399;border-radius:5px;padding:2px 8px;font-size:11px;font-weight:700;display:inline-block;margin-bottom:8px}
  .ssrules{margin:0;color:#cbd5e1;font-size:13px;line-height:1.6}
  .ssrules strong{color:#6ee7b7}
  .station-header-label{font-size:11px;font-weight:800;letter-spacing:1px;margin-bottom:8px}
  .back-btn{width:100%;margin-top:6px;padding:11px;border:none;border-radius:9px;color:#fff;font-weight:700;font-size:14px}

  /* SVG diagrams */
  .diagram-label{font-size:11px;color:#64748b;margin:12px 0 4px;font-weight:600;letter-spacing:0.5px}
  .diagram-wrap svg{width:100%;max-width:280px;display:block;border-radius:10px;border:2px solid #15803d}

  /* Edit picker */
  #picker{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;align-items:flex-end;justify-content:center}
  #picker.open{display:flex}
  #picker-inner{background:#1e293b;border-radius:14px 14px 0 0;max-width:660px;width:100%;max-height:75vh;overflow:hidden;display:flex;flex-direction:column}
  .picker-header{padding:16px 20px 12px;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center}
  .picker-title{font-size:11px;color:#64748b;font-weight:700;letter-spacing:0.5px}
  .picker-sub{font-size:12px;color:#94a3b8;margin-top:2px}
  .picker-close{background:#334155;border:none;color:#94a3b8;border-radius:6px;width:28px;height:28px;font-size:13px}
  .picker-list{overflow-y:auto;padding:12px 16px 20px;flex:1}
  .picker-item{background:#0f172a;border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;border:2px solid transparent;transition:border-color 0.1s}
  .picker-item:hover{border-color:var(--accent)}
  .picker-item-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
  .picker-item-name{font-weight:700;font-size:13px;color:#f1f5f9}
  .picker-min{font-size:10px;color:#64748b;background:#1e293b;border-radius:5px;padding:1px 6px}
  .picker-format{font-size:10px;color:#10b981;background:#064e3b;border-radius:5px;padding:1px 6px}
  .picker-desc{margin:0;font-size:12px;color:#64748b;line-height:1.5}
  .picker-diag{transform:scale(0.75);transform-origin:top left;height:110px;overflow:hidden;margin-top:4px}
  .picker-empty{text-align:center;padding:30px;color:#475569}

  @media(max-width:480px){
    .header-controls{gap:8px}
    .player-select-wrap{margin-left:0;width:100%}
    .legend-hint{display:none}
  }
</style>
</head>
<body>

<div id="header">
  <div class="header-inner">
    <div class="header-top">
      <span style="font-size:28px">⚽</span>
      <div>
        <h1>Under 9 Soccer Coaching Plan</h1>
        <p style="font-size:12px;color:var(--light);opacity:0.8;margin-top:2px">32 Weeks · 1 Hour Sessions · 14–24 Players · Tap a week to view &amp; edit</p>
      </div>
    </div>
    <div class="header-controls">
      <button class="rot-btn active" onclick="setRotation(1)" id="rot1">Rotation 1</button>
      <button class="rot-btn" onclick="setRotation(2)" id="rot2">Rotation 2</button>
      <div class="player-select-wrap">
        <label for="playerCount" style="color:var(--light)">👦 Players today:</label>
        <select id="playerCount" onchange="setPlayerCount(this.value)">
          <option value="14">14 players</option>
          <option value="15">15 players</option>
          <option value="16" selected>16 players</option>
          <option value="17">17 players</option>
          <option value="18">18 players</option>
          <option value="19">19 players</option>
          <option value="20">20 players</option>
          <option value="21">21 players</option>
          <option value="22">22 players</option>
          <option value="23">23 players</option>
          <option value="24">24 players</option>
        </select>
      </div>
    </div>
  </div>
</div>

<div id="main">
  <div class="legend">
    <div class="legend-item">🌡️ Warm-Up: 8 min</div>
    <div class="legend-item">🔵 3 Stations × 8 min</div>
    <div class="legend-item">🏆 Game: 15 min</div>
    <div class="legend-hint">✏️ Tap any week to view session &amp; swap drills</div>
  </div>
  <div class="week-grid" id="weekGrid"></div>
</div>

<!-- Detail modal -->
<div id="overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal">
    <div class="modal-header" id="modalHeader">
      <div class="modal-header-top">
        <div>
          <div class="modal-label" id="modalLabel"></div>
          <h2 id="modalTheme"></h2>
        </div>
        <div class="modal-controls">
          <button class="edit-btn" id="editBtn" onclick="toggleEdit()">✏️ Edit</button>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
      </div>
      <div class="tags" id="modalTags"></div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- Swap picker -->
<div id="picker" onclick="if(event.target===this)closePicker()">
  <div id="picker-inner">
    <div class="picker-header">
      <div>
        <div class="picker-title" id="pickerTitle"></div>
        <div class="picker-sub" id="pickerSub"></div>
      </div>
      <button class="picker-close" onclick="closePicker()">✕</button>
    </div>
    <div class="picker-list" id="pickerList"></div>
  </div>
</div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────
let rotation = 1;
let playerCount = 16;
let editMode = false;
let openWeekIdx = null;
let pendingSwap = null; // {type, stationIdx}
let weekData = null; // populated after BASE_WEEKS defined

// ─── COLOURS ─────────────────────────────────────────────────────────
const ROT = {
  1: { bg:'#1e3a5f', accent:'#3b82f6', light:'#dbeafe' },
  2: { bg:'#1a3a2a', accent:'#10b981', light:'#d1fae5' }
};

// ─── SVG HELPERS ──────────────────────────────────────────────────────
const SVG_NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs={}, children=[]) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, v);
  for (const c of children) if(c) el.appendChild(c);
  return el;
}
const cone = (x,y,color='#f59e0b',size=7) => svgEl('polygon',{points:`${x},${y-size} ${x-size*0.7},${y+size*0.4} ${x+size*0.7},${y+size*0.4}`,fill:color,stroke:'#000','stroke-width':'0.5'});
const ball = (x,y,r=6) => svgEl('g',{},[svgEl('circle',{cx:x,cy:y,r,fill:'#fff',stroke:'#222','stroke-width':'1'}),svgEl('circle',{cx:x,cy:y,r:r*0.45,fill:'#222',opacity:'0.15'})]);
function player(x,y,label='P',color='#3b82f6',size=11) {
  const g = svgEl('g');
  g.appendChild(svgEl('circle',{cx:x,cy:y,r:size,fill:color,stroke:'#fff','stroke-width':'1.5'}));
  const t = svgEl('text',{x,y:y+4,'text-anchor':'middle',fill:'#fff','font-size':'9','font-weight':'bold'});
  t.textContent=label; g.appendChild(t); return g;
}
function arrow(x1,y1,x2,y2,color='#10b981',dashed=false) {
  const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy)||1;
  const ux=dx/len,uy=dy/len,h=8;
  const ax=x2-ux*h-uy*h*0.4,ay=y2-uy*h+ux*h*0.4,bx=x2-ux*h+uy*h*0.4,by=y2-uy*h-ux*h*0.4;
  const g=svgEl('g');
  const ln=svgEl('line',{x1,y1,x2,y2,stroke:color,'stroke-width':'2',opacity:'0.9'});
  if(dashed) ln.setAttribute('stroke-dasharray','5,4');
  g.appendChild(ln);
  g.appendChild(svgEl('polygon',{points:`${x2},${y2} ${ax},${ay} ${bx},${by}`,fill:color}));
  return g;
}
function goal(x,y,w=30,h=10,dir='top') {
  if(dir==='top') return svgEl('rect',{x:x-w/2,y,width:w,height:h,fill:'none',stroke:'#fff','stroke-width':'2'});
  return svgEl('rect',{x:x-w/2,y:y-h,width:w,height:h,fill:'none',stroke:'#fff','stroke-width':'2'});
}
function txt(x,y,str,color='#86efac',size=9) {
  const t=svgEl('text',{x,y,'text-anchor':'middle',fill:color,'font-size':size});
  t.textContent=str; return t;
}
function pitchSVG(w,h,children=[]) {
  const svg=svgEl('svg',{width:'100%',viewBox:`0 0 ${w} ${h}`,style:`background:#166534;border-radius:10px;border:2px solid #15803d;display:block;max-width:${w}px`});
  svg.appendChild(svgEl('rect',{x:'4',y:'4',width:w-8,height:h-8,fill:'none',stroke:'#15803d','stroke-width':'1.5'}));
  for(const c of children) if(c) svg.appendChild(c);
  return svg;
}
function makeDiagramWrap(svg) {
  const lbl=document.createElement('div'); lbl.className='diagram-label'; lbl.textContent='📐 SETUP DIAGRAM';
  const wrap=document.createElement('div'); wrap.className='diagram-wrap';
  wrap.appendChild(lbl); wrap.appendChild(svg);
  return wrap;
}

// ─── DIAGRAM BUILDERS ────────────────────────────────────────────────
function diagBallTag() {
  const children=[];
  [40,80,120,160,200].forEach(x=>children.push(cone(x,20)));
  [40,80,120,160,200].forEach(x=>children.push(cone(x,140)));
  const px=[20,60,100,140,180,220],py=[60,90,75,100,65,85];
  const cols=['#3b82f6','#ef4444','#3b82f6','#ef4444','#3b82f6','#ef4444'];
  px.forEach((x,i)=>{ children.push(player(x,py[i],'P',cols[i])); children.push(ball(x+8,py[i]+12,5)); });
  children.push(txt(120,155,'Every player has a ball — free movement'));
  return makeDiagramWrap(pitchSVG(240,160,children));
}
function diagSoleRolls() {
  const c=[player(60,70,'P1','#3b82f6'),ball(90,70,6),arrow(90,70,150,70,'#10b981'),player(180,70,'P2','#ef4444')];
  const l1=svgEl('line',{x1:30,y1:50,x2:30,y2:90,stroke:'#f59e0b','stroke-width':'1.5','stroke-dasharray':'4,3'});
  const l2=svgEl('line',{x1:210,y1:50,x2:210,y2:90,stroke:'#f59e0b','stroke-width':'1.5','stroke-dasharray':'4,3'});
  c.push(l1,l2,txt(30,45,'Start','#fbbf24',8),txt(210,45,'End','#fbbf24',8),txt(120,105,'5m apart · sole-roll across'));
  return makeDiagramWrap(pitchSVG(240,140,c));
}
function diagConeSlalom() {
  const c=[cone(50,70),cone(80,70),cone(110,70),cone(140,70),cone(170,70),player(25,70,'P','#3b82f6'),ball(35,70,5)];
  const path=svgEl('path',{d:'M40,70 Q65,50 80,70 Q95,90 110,70 Q125,50 140,70 Q155,90 170,70 L200,70',fill:'none',stroke:'#10b981','stroke-width':'2','stroke-dasharray':'6,3'});
  c.push(path,arrow(195,70,215,70,'#10b981'),txt(130,120,'Weave between cones — 1m spacing'));
  return makeDiagramWrap(pitchSVG(260,140,c));
}
function diagGatePassing() {
  const c=[];
  [[70,50],[130,40],[190,60],[60,110],[150,120],[200,100]].forEach(([x,y])=>{ c.push(cone(x-8,y),cone(x+8,y)); });
  c.push(player(40,80,'P1','#3b82f6'),ball(55,80,5),arrow(58,78,62,52,'#10b981'),player(180,140,'P2','#ef4444'),txt(130,150,'Pass through as many gates as possible'));
  return makeDiagramWrap(pitchSVG(260,160,c));
}
function diagTrianglePassing() {
  const c=[player(110,30,'P1','#3b82f6'),player(50,130,'P2','#ef4444'),player(170,130,'P3','#10b981'),ball(85,85,5)];
  c.push(arrow(110,42,60,118,'#fbbf24'),arrow(58,118,162,118,'#fbbf24'),arrow(162,118,116,42,'#fbbf24',true),txt(110,158,'8m per side · rotate direction on command'));
  return makeDiagramWrap(pitchSVG(220,170,c));
}
function diagShooting() {
  const c=[goal(120,10,50,12,'top'),player(80,80,'GK','#7c3aed',12)];
  [[60,130],[120,140],[180,130]].forEach(([x,y],i)=>{ c.push(ball(x,y,5),arrow(x,y-5,[70,120,110][i],[30,20,25][i],'#ef4444')); });
  [[60,140],[120,150],[180,140]].forEach(([x,y])=>c.push(player(x,y,'P','#3b82f6')));
  c.push(txt(120,162,'Multiple angles · aim for corners'));
  return makeDiagramWrap(pitchSVG(240,170,c));
}
function diagJockeying() {
  const l1=svgEl('line',{x1:60,y1:20,x2:60,y2:130,stroke:'#f59e0b','stroke-width':'1.5','stroke-dasharray':'4,3'});
  const l2=svgEl('line',{x1:130,y1:20,x2:130,y2:130,stroke:'#f59e0b','stroke-width':'1.5','stroke-dasharray':'4,3'});
  const c=[l1,l2,player(90,110,'A','#3b82f6'),ball(90,97,5),arrow(90,97,90,50,'#3b82f6',true),player(90,40,'D','#ef4444'),arrow(90,52,90,65,'#ef4444'),txt(100,138,'3m lane · D jockeys, doesn\'t tackle')];
  return makeDiagramWrap(pitchSVG(200,150,c));
}
function diag2v1() {
  const c=[goal(110,10,50,12,'top'),player(75,90,'A1','#3b82f6'),player(145,100,'A2','#3b82f6'),player(110,60,'D','#ef4444'),ball(85,90,5),arrow(85,88,138,98,'#10b981'),arrow(145,98,120,25,'#10b981',true),txt(110,150,'A1 passes → A2 finishes past 1 defender')];
  return makeDiagramWrap(pitchSVG(220,160,c));
}
function diagWidePlay() {
  const l1=svgEl('line',{x1:30,y1:20,x2:30,y2:140,stroke:'#f59e0b','stroke-width':'1','stroke-dasharray':'3,3'});
  const l2=svgEl('line',{x1:230,y1:20,x2:230,y2:140,stroke:'#f59e0b','stroke-width':'1','stroke-dasharray':'3,3'});
  const c=[goal(130,10,50,12,'top'),player(30,100,'W','#3b82f6'),ball(42,100,5),player(120,80,'A1','#3b82f6'),player(150,95,'A2','#3b82f6'),arrow(42,98,30,25,'#10b981',true),arrow(120,78,115,30,'#3b82f6',true),arrow(150,93,145,30,'#3b82f6',true),l1,l2,txt(130,155,'Wide player delivers · runs to far/near post')];
  return makeDiagramWrap(pitchSVG(260,170,c));
}
function diagCounterAttack() {
  const c=[goal(130,10,50,12,'top'),goal(130,158,50,12,'bottom'),player(130,90,'GK','#7c3aed',12),player(80,130,'D','#ef4444'),player(190,45,'F','#3b82f6'),ball(115,90,5),arrow(120,88,185,50,'#10b981'),txt(130,150,'GK distributes quickly → forward runs in behind',`#86efac`,7)];
  return makeDiagramWrap(pitchSVG(260,170,c));
}
function diagRondo() {
  const pts=[[100,20],[175,65],[165,145],[100,175],[35,145],[25,65]];
  const c=pts.map(([x,y])=>player(x,y,'P','#3b82f6',11));
  c.push(player(100,100,'D','#ef4444',12),ball(140,48,5),arrow(140,46,168,66,'#fbbf24'));
  return makeDiagramWrap(pitchSVG(200,190,c));
}
function diagFreeKick() {
  const c=[goal(120,10,60,12,'top'),player(90,35,'GK','#7c3aed',11)];
  [105,120,135].forEach(x=>c.push(player(x,75,'W','#ef4444',10)));
  const ar=arrow(120,118,120,80,'#10b981'); ar.querySelector('line').setAttribute('stroke-dasharray','5,4');
  c.push(player(120,110,'P','#3b82f6'),ball(120,122,5),ar,txt(120,150,'Chip over wall, aim for corners'));
  return makeDiagramWrap(pitchSVG(240,160,c));
}
function diagCheckRun() {
  const path=svgEl('path',{d:'M160,62 L160,100 L110,80',fill:'none',stroke:'#10b981','stroke-width':'2','stroke-dasharray':'5,3'});
  const c=[player(160,60,'C','#3b82f6'),path,arrow(110,80,108,80,'#10b981'),cone(160,110),player(60,80,'Co','#7c3aed',12),ball(80,80,5),arrow(82,80,106,80,'#fbbf24'),txt(120,145,'Run away → check back sharp to receive')];
  return makeDiagramWrap(pitchSVG(240,160,c));
}
function diagSmallSided4v4() {
  const c=[goal(140,8,50,11,'top'),goal(140,168,50,11,'bottom')];
  [[70,40],[140,60],[200,40],[120,50]].forEach(([x,y])=>c.push(player(x,y,'B','#ef4444',10)));
  [[80,140],[140,125],[210,135],[150,145]].forEach(([x,y])=>c.push(player(x,y,'A','#3b82f6',10)));
  c.push(ball(140,92,6));
  return makeDiagramWrap(pitchSVG(280,180,c));
}

const DIAGRAMS = {
  'Ball Tag': diagBallTag,'Traffic Lights':diagBallTag,'Compass Dribbling':diagBallTag,
  'Chase the Tail':diagBallTag,'Hot Floor Dribbling':diagBallTag,'Relay Races':diagBallTag,

// ─── INIT ─────────────────────────────────────────────────────────────
weekData = BASE_WEEKS.map(w => ({...w, stations: w.stations.map(s=>({...s}))}));

function applyTheme() {
  const r = ROT[rotation];
  document.getElementById('header').style.background = r.bg;
  document.getElementById('header').style.setProperty('--accent', r.accent);
  document.getElementById('header').style.setProperty('--light', r.light);
  document.documentElement.style.setProperty('--accent', r.accent);
  document.documentElement.style.setProperty('--light', r.light);
}

function setRotation(r) {
  rotation = r;
  document.getElementById('rot1').classList.toggle('active', r===1);
  document.getElementById('rot2').classList.toggle('active', r===2);
  applyTheme();
  renderGrid();
}

function setPlayerCount(v) {
  playerCount = parseInt(v);
}

function renderGrid() {
  const grid = document.getElementById('weekGrid');
  grid.innerHTML = '';
  weekData.filter(w => w.rotation === rotation).forEach((w, i) => {
    const card = document.createElement('div');
    card.className = 'week-card';
    card.style.setProperty('--wc', w.colour);
    card.innerHTML = `
      <span class="week-badge" style="background:${w.colour}">WEEK ${w.week}</span>
      <h3>${w.theme}</h3>
      <div class="week-drills">${w.stations.map(s=>s.name).join(' · ')}</div>`;
    card.addEventListener('click', () => openModal(w));
    grid.appendChild(card);
  });
}

// ─── MODAL ───────────────────────────────────────────────────────────
function openModal(w) {
  openWeekIdx = weekData.indexOf(w);
  editMode = false;
  renderModal(w);
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
  openWeekIdx = null;
  editMode = false;
}

function toggleEdit() {
  editMode = !editMode;
  const btn = document.getElementById('editBtn');
  btn.textContent = editMode ? '✓ Done' : '✏️ Edit';
  btn.style.background = editMode ? '#fff' : 'rgba(255,255,255,0.2)';
  btn.style.color = editMode ? weekData[openWeekIdx].colour : '#fff';
  document.getElementById('modalBody').querySelectorAll('.swap-btn').forEach(b => {
    b.style.display = editMode ? 'inline-block' : 'none';
  });
}

function renderModal(w) {
  const r = ROT[rotation];
  document.getElementById('modalHeader').style.background = w.colour;
  document.getElementById('modal').style.borderColor = w.colour;
  document.getElementById('modalLabel').textContent = `ROTATION ${w.rotation} · WEEK ${w.week}`;
  document.getElementById('modalTheme').textContent = w.theme;
  const editBtn = document.getElementById('editBtn');
  editBtn.style.color = editMode ? w.colour : '#fff';
  document.getElementById('modalTags').innerHTML =
    `<span class="tag">⏱ 60 min</span><span class="tag">👦 U9</span><span class="tag">👥 ${playerCount} today</span>`;

  const body = document.getElementById('modalBody');
  body.innerHTML = '';

  // Warm-up
  body.appendChild(sessionBlock('🌡️ WARM-UP', '8 min', '#f59e0b', w.colour, () => {
    const name = document.createElement('div');
    name.className = 'drill-name drill-name-warm';
    name.textContent = w.warmup.name;
    const desc = document.createElement('p');
    desc.className = 'drill-desc';
    desc.textContent = w.warmup.desc;
    const frag = document.createDocumentFragment();
    frag.appendChild(name); frag.appendChild(desc);
    const diagFn = DIAGRAMS[w.warmup.name];
    if (diagFn) frag.appendChild(diagFn());
    return frag;
  }, () => openPicker('warmup', null)));

  // Stations header
  const sh = document.createElement('div');
  sh.className = 'station-header-label';
  sh.style.color = w.colour;
  sh.textContent = '🔵 STATIONS — rotate every 8 minutes';
  body.appendChild(sh);

  w.stations.forEach((s, i) => {
    body.appendChild(sessionBlock(`Station ${i+1}`, '8 min', w.colour, w.colour, () => {
      const name = document.createElement('div');
      name.className = 'drill-name';
      name.textContent = s.name;
      const desc = document.createElement('p');
      desc.className = 'drill-desc';
      desc.textContent = s.desc;
      const frag = document.createDocumentFragment();
      frag.appendChild(name); frag.appendChild(desc);
      const diagFn = DIAGRAMS[s.name];
      if (diagFn) frag.appendChild(diagFn());
      return frag;
    }, () => openPicker('station', i)));
  });

  // Small-sided
  body.appendChild(sessionBlock('🏆 SMALL-SIDED GAME', '15 min', '#10b981', w.colour, () => {
    const fmt = document.createElement('span');
    fmt.className = 'ssformat';
    fmt.textContent = w.smallSided.format;
    const rules = document.createElement('p');
    rules.className = 'ssrules';
    rules.innerHTML = `<strong>Focus: </strong>${w.smallSided.rules}`;
    const frag = document.createDocumentFragment();
    frag.appendChild(fmt); frag.appendChild(rules);
    return frag;
  }, () => openPicker('smallSided', null)));

  // Back button
  const back = document.createElement('button');
  back.className = 'back-btn';
  back.style.background = w.colour;
  back.textContent = '← Back to Plan';
  back.addEventListener('click', closeModal);
  body.appendChild(back);
}

function sessionBlock(label, duration, labelColor, accentColor, contentFn, swapFn) {
  const block = document.createElement('div');
  block.className = 'session-block';
  block.style.borderLeftColor = labelColor;

  const header = document.createElement('div');
  header.className = 'session-block-header';

  const lbl = document.createElement('span');
  lbl.className = 'session-label';
  lbl.style.color = labelColor;
  lbl.textContent = label;

  const meta = document.createElement('div');
  meta.className = 'session-meta';

  const dur = document.createElement('span');
  dur.className = 'duration-badge';
  dur.textContent = duration;

  const swap = document.createElement('button');
  swap.className = 'swap-btn';
  swap.textContent = '⇄ Swap';
  swap.style.display = editMode ? 'inline-block' : 'none';
  swap.addEventListener('click', (e) => { e.stopPropagation(); swapFn(); });

  meta.appendChild(dur); meta.appendChild(swap);
  header.appendChild(lbl); header.appendChild(meta);
  block.appendChild(header);

  const content = contentFn();
  if (content.nodeType) block.appendChild(content);
  return block;
}

// ─── PICKER ──────────────────────────────────────────────────────────
function openPicker(type, stationIdx) {
  pendingSwap = { type, stationIdx };
  const w = weekData[openWeekIdx];
  const labels = { warmup: 'SWAP WARM-UP', station: `SWAP STATION ${stationIdx+1}`, smallSided: 'SWAP SMALL-SIDED GAME' };
  document.getElementById('pickerTitle').textContent = labels[type];
  document.getElementById('pickerSub').textContent = `Showing options for ${playerCount} players`;

  const items = filteredDrills(type);
  const list = document.getElementById('pickerList');
  list.innerHTML = '';

  if (items.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'picker-empty';
    empty.textContent = `No drills found for ${playerCount} players. Try adjusting the player count.`;
    list.appendChild(empty);
  } else {
    items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'picker-item';
      el.innerHTML = `
        <div class="picker-item-top">
          <span class="picker-item-name">${item.name}</span>
          ${item.minPlayers ? `<span class="picker-min">min ${item.minPlayers}p</span>` : ''}
          ${item.format ? `<span class="picker-format">${item.format}</span>` : ''}
        </div>
        <p class="picker-desc">${item.desc}</p>`;
      const diagFn = DIAGRAMS[item.name];
      if (diagFn) {
        const dw = document.createElement('div');
        dw.className = 'picker-diag';
        const d = diagFn();
        if (d.querySelector) { const svg = d.querySelector('svg'); if(svg) dw.appendChild(svg.cloneNode(true)); }
        el.appendChild(dw);
      }
      el.addEventListener('mouseenter', () => el.style.borderColor = ROT[rotation].accent);
      el.addEventListener('mouseleave', () => el.style.borderColor = 'transparent');
      el.addEventListener('click', () => applySwap(item));
      list.appendChild(el);
    });
  }

  document.getElementById('picker').classList.add('open');
}

function closePicker() {
  document.getElementById('picker').classList.remove('open');
  pendingSwap = null;
}

function filteredDrills(type) {
  const fits = d => d.minPlayers <= playerCount && (!d.maxPlayers || d.maxPlayers >= playerCount);
  if (type === 'warmup') return DRILL_LIBRARY.warmups.filter(fits);
  if (type === 'smallSided') return DRILL_LIBRARY.smallSided.filter(fits);
  return DRILL_LIBRARY.stations.filter(fits);
}

function applySwap(item) {
  if (!pendingSwap || openWeekIdx === null) return;
  const { type, stationIdx } = pendingSwap;
  const w = weekData[openWeekIdx];
  if (type === 'warmup') {
    w.warmup = { name: item.name, duration: '8 min', desc: item.desc };
  } else if (type === 'station') {
    w.stations[stationIdx] = { name: item.name, duration: '8 min', desc: item.desc };
  } else if (type === 'smallSided') {
    w.smallSided = { format: item.format || item.name, duration: '15 min', rules: item.desc };
  }
  closePicker();
  renderModal(w);
  renderGrid();
  // Re-apply edit mode visuals
  if (editMode) {
    document.getElementById('modalBody').querySelectorAll('.swap-btn').forEach(b => b.style.display = 'inline-block');
  }
}

// ─── BOOT ─────────────────────────────────────────────────────────────
applyTheme();
renderGrid();
</script>
